target-version = "py310"
line-length = 110

[lint]
# Politique figée : erreurs réelles (pycodestyle E4/E7/E9, Pyflakes F, warnings W)
# plutôt que le ruleset "recommended" par défaut, qui varie selon les versions de ruff.
select = ["E4", "E7", "E9", "F", "W"]
ignore = ["E501", "E402", "E741"]

[lint.per-file-ignores]
# Tests : imports de fixtures volontairement non utilisés directement / variables d'assertion
"tests/*" = ["F401", "F841"]
